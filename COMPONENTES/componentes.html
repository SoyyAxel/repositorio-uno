<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>components</title>
<style>
    button { 
        background-color: #60CEF3;
        color: #000000;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        font-weight: 400;
        height: 40px;
        font-size: 16px;
        padding-left: 16px;
        padding-right:16px;
        box-shadow: -3px 3px 4.5px rgba(0, 0, 0, 0.66);
    }
    button:hover {
        background-color: #4FAAC9;
        box-shadow: -3px 3px 9.4px rgba(0, 0, 0, 0.66);
        cursor: pointer;
    }
    button:active {
        background-color: #41869C;
        box-shadow: none;
    }
</style>

</head>
<body>
  <button>button</button>  
</body>
</html>
